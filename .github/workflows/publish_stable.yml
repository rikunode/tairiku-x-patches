name: Publish stable Morphe patch

on:
  push:
    tags:
      - 'v*-tairiku.*'

permissions:
  contents: write
  packages: read

jobs:
  stable_release:
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate stable manifest and existing tests
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-tairiku\.[0-9]+$ ]]
          test "$version" = "$(sed -n 's/^version = //p' gradle.properties)"
          python3 scripts/test-morphe-metadata.py
          bash scripts/test-recommendation-filter.sh
          python3 scripts/test-external-post-link.py
          python3 - <<'PY'
          import json
          patches = json.load(open('patches-list.json', encoding='utf-8'))
          actual = {p['name'] for p in patches['patches']}
          expected = {'Fix external post links', 'Hide Find more', 'Hide Who to follow'}
          assert actual == expected, (actual, expected)
          print('Stable manifest has exactly three X patches: PASS')
          PY

      - name: Build and test release bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:test --no-daemon

      - name: Verify release artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -s "patches/build/libs/patches-$version.mpp"
          unzip -t "patches/build/libs/patches-$version.mpp" >/dev/null
          sha256sum "patches/build/libs/patches-$version.mpp"

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "patches/build/libs/patches-$version.mpp" \
            patches-bundle.json \
            --target "$GITHUB_SHA" \
            --title "$version (stable)" \
            --notes "Stable release: Fix external post links verified in an on-device screenshot with hidden For You tab. Includes Hide Find more and Hide Who to follow. Source-import and app startup/link handling on other APK versions should still be tested before generalizing."
          gh release view "$GITHUB_REF_NAME" --json tagName,isPrerelease,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}'
